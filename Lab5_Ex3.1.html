<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lợi ích của công nghệ số trong học tập</title>
    <style>
        /* Định dạng chung */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #0d2b5c;
            margin-bottom: 25px;
        }

        /* Định dạng phần Infographic */
        .infographic-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .infographic-img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        /* Định dạng khung Embed Video YouTube Responsive */
        .video-section {
            margin-top: 30px;
        }

        .video-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #1a437e;
            margin-bottom: 15px;
            border-left: 4px solid #1a437e;
            padding-left: 10px;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* Tỉ lệ khung hình 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Lợi Ích Của Công Nghệ Số Trong Học Tập</h1>

        <!-- Phần hiển thị Infographic -->
        <div class="infographic-section">
            <!-- Thay đường dẫn file ảnh của bạn vào thuộc tính src dưới đây -->
            <img class="infographic-img" src="Lab05_Ex2.1.png" alt="Infographic Lợi ích của công nghệ số trong học tập">
        </div>

        <!-- Phần hiển thị Video Youtube -->
        <div class="video-section">
            <div class="video-title">Video Minh Họa / Tham Khảo</div>
            <div class="video-wrapper">
                <!-- Mã nhúng YouTube iframe (ID video: t0gDG57RXbo) -->
                <iframe 
                    src="https://www.youtube.com/embed/t0gDG57RXbo" 
                    title="YouTube video player" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
                </iframe>
            </div>
        </div>
    </div>

</body>
</html>
